# Brain unit tests, typecheck and agent-definition validation (packages/contracts/agents.json).
# Engine-level checks (Lua selftest, live bridge test) need a local Canary: scripts/verify.ps1.
name: brain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/brain
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
